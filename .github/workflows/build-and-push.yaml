name: Build and Push Docker image

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]

  

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix: 
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with: 
          node-version: ${{matrix.node-version}}

      - name: Docker login
        uses: docker/login-action@v4
        with:
          username: ${{secrets.DOCKER_USERNAME}}
          password: ${{secrets.DOCKER_PASSWORD}}

      - name: Docker build
        run: docker build -t ${{secrets.DOCKER_USERNAME}}/entrahub:1.${{github.run_number}} .

      # - name: Push to docker hub (tag)
      #   run: docker tag entrahub:1.${{ github.run_number }} ${{ secrets.DOCKER_USERNAME }}/entrahub:latest

      - name: Push to docker hub (push)
        run: docker push ${{secrets.DOCKER_USERNAME}}/entrahub:1.${{github.run_number}}

